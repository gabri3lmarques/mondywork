<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mondywork - Job Opportunities in USA</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/style.css">
    <!-- 1. O plano B para navegadores antigos -->
    <link rel="icon" href="../img/favicon/favicon.ico" sizes="any">

    <!-- 2. O astro principal: moderno e escalável -->
    <link rel="icon" href="../img/favicon/favicon.svg" type="image/svg+xml">

    <!-- 3. Para dispositivos Apple (iPhone/iPad) -->
    <link rel="apple-touch-icon" href="../img/favicon/apple-touch-icon.png">    
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RPQ9FFFNP1"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
    
      gtag('config', 'G-RPQ9FFFNP1');
    </script>
</head>
<body>

    <header class="site-header">
        <nav class="top-menu">
            <div class="menu-content">
                <span class="logo"><a href="/">Mondywork</a></span>
                <div class="menu-links">
                    <a href="/" class="menu-link">🇧🇷 Jobs in Brazil</a>
                    <a href="https://www.linkedin.com/company/mondywork/" target="_blank" class="menu-link menu-link-icon" aria-label="LinkedIn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
                    </a>
                </div>
            </div>
        </nav>

        <div class="mosaic-container">
            <div class="mosaic-grid">
                <div class="mosaic-item"><img src="/img/1.jpeg" alt=""></div>
                <div class="mosaic-item"><img src="/img/2.jpeg" alt=""></div>
                <div class="mosaic-item"><img src="/img/3.jpeg" alt=""></div>
                <div class="mosaic-item"><img src="/img/4.jpeg" alt=""></div>
                <div class="mosaic-item"><img src="/img/5.jpeg" alt=""></div>
                <div class="mosaic-item"><img src="/img/6.jpeg" alt=""></div>
                <div class="mosaic-item"><img src="/img/7.jpeg" alt=""></div>
                <div class="mosaic-item"><img src="/img/8.jpeg" alt=""></div>
            </div>

            <div class="mosaic-overlay"></div>
            <div class="header-overlay">
                <h1 class="header-title">
                    <span class="title-highlight">Jobs in USA</span>
                    <span class="title-sub">Work from anywhere in USA!</span>
                </h1>
                <div class="search-wrapper">
                    <input type="text" id="search" class="search-input" placeholder="Search jobs by title, company or skills...">
                    <div id="search-loading" class="search-loading hidden">
                        <svg class="loading-icon-sm" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                        </svg>
                        <span>Searching...</span>
                    </div>
                </div>
                <div id="vagas-total" class="vagas-total"></div>
            </div>

            <div class="gradient-fade"></div>
        </div>
    </header>

    <main>
        <div id="results-info" class="results-info"></div>
        <div id="vagas-container"></div>
        
        <div id="loading" class="loading hidden">
            <svg class="loading-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            <span>Loading...</span>
        </div>
        
        <div id="sentinel" class="sentinel"></div>
    </main>

    <button id="back-to-top" class="back-to-top hidden" aria-label="Back to top">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
    </button>

    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-content" role="dialog" aria-modal="true">
            <div class="modal-header">
                <div>
                    <h2 id="modal-title" class="modal-title"></h2>
                    <p id="modal-subtitle" class="modal-subtitle"></p>
                </div>
                <button id="modal-close" class="modal-close" aria-label="Close">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div id="modal-body" class="modal-body"></div>
            <div class="modal-footer">
                <a id="modal-apply" href="#" target="_blank" class="btn btn-primary btn-lg">Apply Now</a>
            </div>
        </div>
    </div>

    <script src="/js/app-exterior.js"></script>

</body>
</html>
